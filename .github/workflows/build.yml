name: Build Plugin

on:
  push:
    branches: [ "main" ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  build:
    name: Build libimgtxd_hook.so
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Android NDK r27
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Build Plugin
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: ./build.sh

      - name: Verify Exports
        run: |
          file build/libimgtxd_hook.so
          ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm -D build/libimgtxd_hook.so | grep -E "__GetModInfo|OnModLoad"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libimgtxd_hook
          path: build/libimgtxd_hook.so
          if-no-files-found: error

      - name: Attach to Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/libimgtxd_hook.so --clobber --repo "${{ github.repository }}"
